<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b7cf6"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d96c4f"/></marker>
</defs>
<rect width="1200" height="640" fill="#111318"/>
<rect x="80" y="150" width="520" height="420" rx="14" fill="#1c2230" stroke="#2c313b" stroke-width="1.5"/>
<text x="100" y="136" fill="#e8eaee" font-size="16" font-weight="600" text-anchor="start">Окно активити</text>
<text x="100" y="180" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start">свой ViewRootImpl, поверхность и дерево render node</text>
<g stroke="#99a1af" stroke-width="1.5" fill="#99a1af"><line x1="566" y1="166" x2="555" y2="180"/><line x1="566" y1="166" x2="577" y2="180"/><circle cx="566" cy="166" r="4"/><circle cx="555" cy="180" r="4"/><circle cx="577" cy="180" r="4"/></g>
<rect x="104" y="202" width="146" height="72" rx="8" fill="#4c6ef5" opacity="0.85"/>
<rect x="264" y="202" width="146" height="72" rx="8" fill="#12b886" opacity="0.85"/>
<rect x="424" y="202" width="146" height="72" rx="8" fill="#f59f00" opacity="0.85"/>
<rect x="104" y="290" width="146" height="72" rx="8" fill="#12b886" opacity="0.85"/>
<rect x="264" y="290" width="146" height="72" rx="8" fill="#f59f00" opacity="0.85"/>
<rect x="424" y="290" width="146" height="72" rx="8" fill="#e64980" opacity="0.85"/>
<rect x="104" y="378" width="146" height="72" rx="8" fill="#f59f00" opacity="0.85"/>
<rect x="264" y="378" width="146" height="72" rx="8" fill="#e64980" opacity="0.85"/>
<rect x="424" y="378" width="146" height="72" rx="8" fill="#4c6ef5" opacity="0.85"/>
<rect x="104" y="466" width="146" height="72" rx="8" fill="#e64980" opacity="0.85"/>
<rect x="264" y="466" width="146" height="72" rx="8" fill="#4c6ef5" opacity="0.85"/>
<rect x="424" y="466" width="146" height="72" rx="8" fill="#12b886" opacity="0.85"/>
<rect x="338" y="282" width="400" height="266" rx="14" fill="#000" opacity="0.35"/>
<rect x="330" y="272" width="400" height="266" rx="14" fill="#232a3a" stroke="#8b7cf6" stroke-width="2"/>
<text x="350" y="304" fill="#8b7cf6" font-size="16" font-weight="600" text-anchor="start">Окно диалога</text>
<g stroke="#8b7cf6" stroke-width="1.5" fill="#8b7cf6"><line x1="696" y1="292" x2="685" y2="306"/><line x1="696" y1="292" x2="707" y2="306"/><circle cx="696" cy="292" r="4"/><circle cx="685" cy="306" r="4"/><circle cx="707" cy="306" r="4"/></g>
<text x="350" y="326" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start">второй android.view.Window:</text>
<text x="350" y="344" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start">свой ViewRootImpl, поверхность и дерево render node</text>
<rect x="350" y="362" width="360" height="98" rx="10" fill="#2c3448" stroke="#2c313b"/>
<text x="368" y="392" fill="#e8eaee" font-size="16" font-weight="500" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Modifier.blur()</text>
<text x="368" y="418" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start">или любая in-window библиотека:</text>
<text x="368" y="438" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start">они размывают то, что нарисовало это окно</text>
<line x1="390" y1="462" x2="390" y2="508" stroke="#d96c4f" stroke-width="2.5" marker-end="url(#s)"/>
<line x1="332" y1="516" x2="728" y2="516" stroke="#d96c4f" stroke-width="3"/>
<text x="412" y="484" fill="#d96c4f" font-size="13" font-weight="400" text-anchor="start">упирается в край окна,</text>
<text x="412" y="502" fill="#d96c4f" font-size="13" font-weight="400" text-anchor="start">до слоя активити не дотянуться</text>
<text x="790" y="170" fill="#e8eaee" font-size="16" font-weight="600" text-anchor="start">Два пути в обход, снаружи композиции</text>
<line x1="790" y1="184" x2="1140" y2="184" stroke="#2c313b"/>
<text x="790" y="224" fill="#8b7cf6" font-size="24" font-weight="700" text-anchor="start">1</text>
<text x="820" y="224" fill="#e8eaee" font-size="16" font-weight="600" text-anchor="start">Попросить систему</text>
<text x="820" y="250" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FLAG_BLUR_BEHIND + blurBehindRadius</text>
<text x="820" y="270" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start">API 31+, и только пока межоконный блюр включён</text>
<path d="M800,292 C 740,235 720,190 604,190" fill="none" stroke="#8b7cf6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="790" y="352" fill="#8b7cf6" font-size="24" font-weight="700" text-anchor="start">2</text>
<text x="820" y="352" fill="#e8eaee" font-size="16" font-weight="600" text-anchor="start">Снять чужое окно самому</text>
<text x="820" y="378" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PixelCopy.request(activity.window, bitmap)</text>
<text x="820" y="398" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start">API 26+, ниже decorView.draw()</text>
<text x="820" y="418" fill="#99a1af" font-size="13" font-weight="400" text-anchor="start">уменьшить ×4, размыть, нарисовать под диалогом</text>
<path d="M800,438 C 750,330 745,200 604,215" fill="none" stroke="#8b7cf6" stroke-width="2" marker-end="url(#a)"/>
<text x="790" y="486" fill="#99a1af" font-size="14" font-weight="400" text-anchor="start">Оба живут вне модификатора.</text>
<text x="790" y="506" fill="#99a1af" font-size="14" font-weight="400" text-anchor="start">Underlay выбирает на устройстве, в рантайме.</text>
<text x="80" y="70" fill="#e8eaee" font-size="28" font-weight="600" text-anchor="start">Почему модификатор не заблюрит фон за диалогом</text>
<text x="80" y="100" fill="#99a1af" font-size="15" font-weight="400" text-anchor="start">Dialog в Compose — не Box поверх экрана. Это второе окно, а лента живёт в первом.</text>
<text x="80" y="612" fill="#5c6472" font-size="12" font-weight="400" text-anchor="start">github.com/timkrest/Underlay</text>
</svg>