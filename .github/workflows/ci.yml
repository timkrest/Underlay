name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Style
        run: ./gradlew ktlintCheck

      - name: Licence headers
        run: .github/scripts/check-license-headers.sh

      - name: Public API
        run: ./gradlew apiCheck

      - name: Compatibility with the last release
        run: .github/scripts/check-api-compatibility.sh "$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"

      - name: Unit tests
        run: ./gradlew :underlay:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :underlay:lintRelease :sample:lintDebug

      - name: Assemble
        run: ./gradlew :underlay:assembleRelease :sample:assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-check
          path: |
            **/build/reports/**
          retention-days: 7

  # The levels that change behaviour: decorView.draw() below 26, PixelCopy from 26, FLAG_BLUR_BEHIND from 31.
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 26, 28, 31, 34]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :underlay:connectedDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
