name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - parallel:
          - uses: actions/setup-java@v6
            with:
              distribution: temurin
              java-version: 21
          - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Style
        run: ./gradlew ktlintCheck

      - name: License headers
        run: .github/scripts/check-license-headers.sh

      - name: Public API
        run: ./gradlew apiCheck

      - name: Compatibility with the last release
        run: .github/scripts/check-api-compatibility.sh "$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"

      - name: Unit tests
        run: ./gradlew :underlay:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :underlay:lintRelease :sample:lintDebug

      # D8 and R8 only warn about unreadable Kotlin metadata.
      - name: Assemble
        run: |
          set -o pipefail
          ./gradlew :underlay:assembleRelease :sample:assembleDebug :sample:assembleRelease 2>&1 | tee assemble.log
          if grep -qi 'kotlin metadata' assemble.log; then
            echo "::error::D8 or R8 cannot read the Kotlin metadata, see kotlinStdlib in gradle/libs.versions.toml"
            exit 1
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-check
          path: |
            **/build/reports/**
          retention-days: 7

  # One level per capture path (decorView.draw, PixelCopy, FLAG_BLUR_BEHIND) plus the newest.
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 26, 28, 31, 34, 36]

    steps:
      - uses: actions/checkout@v7

      - parallel:
          - uses: actions/setup-java@v6
            with:
              distribution: temurin
              java-version: 21
          - uses: android-actions/setup-android@v4
          - name: Enable KVM
            run: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
                | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Instrumentation tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :underlay:connectedDebugAndroidTest

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/**
            **/build/outputs/androidTest-results/**
          retention-days: 7
